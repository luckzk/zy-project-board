# zy-project-board — Docker Compose

services:
  backend:
    build: ./backend
    container_name: zy-board-backend
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - API_KEY=${API_KEY:?API_KEY 未设置，请复制 .env.example 为 .env 并填写}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-change-me}
    volumes:
      - ./backend/data:/app/data

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_KEY: ${API_KEY}
    container_name: zy-board-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
