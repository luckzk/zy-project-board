# 前端容器 nginx 配置
# 由 frontend/Dockerfile 复制到 /etc/nginx/conf.d/default.conf。
# 职责：静态托管 Vite 构建产物，并把 /api/ 反代到 backend 容器。
# 注意：/api/ 走容器内网 backend:8001，只在 docker compose 网络内有效；
# 本地 npm run dev 时由 Vite dev server 处理代理，不走这个文件。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由：找不到的文件一律回 index.html，由前端路由接管
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反代：/api/xxx -> backend:8001/api/xxx
    location /api/ {
        proxy_pass http://backend:8001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 上传的图片：/uploads/xxx -> backend:8001/uploads/xxx（文件存在
    # 后端数据卷 backend/data/uploads 里，随容器重建也不丢）
    location /uploads/ {
        proxy_pass http://backend:8001/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
